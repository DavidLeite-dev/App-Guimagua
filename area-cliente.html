
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#005A8C">
    <title>Área de Cliente | Guimágua Smart Pool</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">
    <main class="auth-layout">

    
        <section class="auth-card" aria-labelledby="loginTitle">

            <a href="index.html"
               class="auth-logo"
               aria-label="Guimágua Smart Pool - Início">

                <img src="logo.png"
                     alt=""
                     class="auth-logo-image">

                <span class="auth-logo-text">
                    GUIMÁGUA
                    <small>SMART POOL</small>
                </span>
            </a>

            <div class="auth-heading">
                <span class="eyebrow">BEM-VINDO</span>
                <h1 id="loginTitle">Área de Cliente</h1>
                <p>Introduza os seus dados para continuar.</p>
            </div>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nome@exemplo.pt"
                        autocomplete="username"
                        aria-describedby="emailError"
                        required
                    >

                    <small
                        class="field-error"
                        id="emailError"
                        hidden>
                    </small>
                </div>

                <div class="form-group">
                    <label for="password">Palavra-passe</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Introduza a sua palavra-passe"
                        autocomplete="current-password"
                        aria-describedby="passwordError"
                        required
                    >

                    <small
                        class="field-error"
                        id="passwordError"
                        hidden>
                    </small>
                </div>

                <div class="auth-options">
                    <a href="recuperar-password.html">
                        Esqueceu-se da palavra-passe?
                    </a>
                </div>

                <div
                    id="loginMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                    hidden>
                </div>

                <button type="submit" class="auth-button">
                    Iniciar sessão
                </button>

            </form>

            <div class="auth-divider"></div>

            <p class="auth-footer">
                <a href="index.html">Voltar à página principal</a>
            </p>

        </section>

        <p class="auth-copyright">
            © <span class="current-year"></span>
            Guimágua Smart Pool. Todos os direitos reservados.
        </p>

    </main>

    <script src="auth.js" defer></script>
</body>
</html>
