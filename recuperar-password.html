
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#005A8C">
    <title>Recuperar Palavra-passe | Guimágua Smart Pool</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">
    <main class="auth-layout">

        <section class="auth-card" aria-labelledby="recoveryTitle">

            <a href="index.html"
               class="auth-logo"
               aria-label="Guimágua Smart Pool - Início">

                <img src="logo.png"
                     alt=""
                     class="auth-logo-image">

                <span class="auth-logo-text">
                    GUIMÁGUA
                    <small>SMART POOL</small>
                </span>
            </a>

            <div class="auth-heading">
                <span class="eyebrow">RECUPERAÇÃO DE ACESSO</span>

                <h1 id="recoveryTitle">
                    Recuperar palavra-passe
                </h1>

                <p>
                    Introduza o seu email para iniciar o processo
                    de recuperação do acesso.
                </p>
            </div>

            <form id="recoveryForm" novalidate>

                <div class="form-group">
                    <label for="recoveryEmail">Email</label>

                    <input
                        type="email"
                        id="recoveryEmail"
                        name="email"
                        placeholder="nome@exemplo.pt"
                        autocomplete="email"
                        aria-describedby="recoveryEmailError"
                        required
                    >

                    <small
                        class="field-error"
                        id="recoveryEmailError"
                        hidden>
                    </small>
                </div>

                <div
                    id="recoveryMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                    hidden>
                </div>

                <button type="submit" class="auth-button">
                    Validar email
                </button>

            </form>

            <div class="auth-divider"></div>

            <p class="auth-footer">
                Já tem conta?
                <a href="area-cliente.html">Iniciar sessão</a>
            </p>

        </section>

        <p class="auth-copyright">
            © <span class="current-year"></span>
            Guimágua Smart Pool. Todos os direitos reservados.
        </p>

    </main>

    <script src="auth.js" defer></script>
</body>
</html>
